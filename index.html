<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的官网</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>欢迎访问我的网站</h1>
            <p>GitHub Pages 静态演示站点</p>
        </header>

        <main class="content">
            <section class="card">
                <h2>关于本站</h2>
                <p>这是一个纯静态网站，使用 HTML + CSS 编写，部署在 GitHub Pages。</p>
            </section>

            <section class="card">
                <h2>功能说明</h2>
                <ul>
                    <li>纯静态，无需后端</li>
                    <li>git push 自动更新页面</li>
                    <li>支持自定义域名 + HTTPS</li>
                </ul>
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 My Website</p>
        </footer>
    </div>
